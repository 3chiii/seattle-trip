<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>시애틀 모녀 여행</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#F4F6F3; --surface:#FFFFFF; --surface-2:#EDF2EE; --ink:#1B2A22; --muted:#66756D; --line:#DCE4DE;
  --accent:#2B6A4F; --accent-ink:#FFFFFF; --accent-soft:#E1EEE6;
  --cedar:#B8642D; --cedar-soft:#F6E7DB;
  --rain:#3F6F9F; --sun:#D19A2F; --cloud:#7B8A94;
  --sans:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --serif:"Gowun Batang","Apple SD Gothic Neo","Nanum Myeongjo",serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1512; --surface:#182019; --surface-2:#1F2A24; --ink:#E9EEEA; --muted:#9DAAA2; --line:#2A3630;
    --accent:#7CC4A2; --accent-ink:#0F1512; --accent-soft:#1F3A2E;
    --cedar:#E0925C; --cedar-soft:#3A2A1F;
    --rain:#7FAEDD; --sun:#E8B860; --cloud:#93A2AB;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#182019; --surface-2:#1F2A24; --ink:#E9EEEA; --muted:#9DAAA2; --line:#2A3630;
  --accent:#7CC4A2; --accent-ink:#0F1512; --accent-soft:#1F3A2E;
  --cedar:#E0925C; --cedar-soft:#3A2A1F;
  --rain:#7FAEDD; --sun:#E8B860; --cloud:#93A2AB;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;word-break:keep-all;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.wrap{max-width:600px;margin:0 auto;padding:0 18px 72px}

/* header */
header{padding:26px 0 12px}
.hdtop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lang{display:flex;align-items:center;gap:7px;font-family:var(--sans);font-size:13px;font-weight:600;color:var(--muted);flex:0 0 auto}
.lang [data-l]{cursor:pointer;user-select:none}
.lang [data-l].on{color:var(--ink)}
.lang .sw{position:relative;width:44px;height:24px;border-radius:999px;border:0;padding:0;background:var(--line);cursor:pointer;flex:0 0 auto}
.lang .sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.lang .sw[aria-checked="true"]::after{transform:translateX(20px)}
.lang .sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.lang .sw::after{transition:transform .22s ease}}
.langsw{font-size:13px;font-weight:600;text-decoration:none;color:var(--accent);border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);white-space:nowrap;font-family:var(--sans)}
.langsw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.eyebrow{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--mono)}
h1{font-family:var(--serif);font-size:32px;line-height:1.2;margin:6px 0 10px;text-wrap:balance}
.sub{color:var(--muted);margin:0;font-size:15.5px;line-height:1.55}
.flights{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.flight{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.flight .k{font-size:12px;color:var(--muted);font-family:var(--mono)}
.flight .t{font-family:var(--mono);font-size:15px;font-weight:500;margin-top:3px}
.flight .d{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.45}

/* tabs */
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;display:flex;gap:6px;border-bottom:1px solid var(--line)}
.tab{flex:1;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 2px;font:inherit;font-size:14px;font-weight:500;cursor:pointer}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

section[data-panel]{padding-top:6px}
.note{background:var(--surface-2);border-radius:12px;padding:14px 16px;font-size:15px;line-height:1.6;margin:14px 0}
.note b{font-weight:600}
h2{font-family:var(--serif);font-size:22px;margin:30px 0 12px;text-wrap:balance}
h3{font-size:16.5px;font-weight:600;margin:18px 0 8px}

/* ===== overview (10일 한눈에) ===== */
.ov{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0 6px}
.ov a{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 6px 9px;text-align:center;position:relative}
.ov a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ov .d{font-family:var(--mono);font-size:15px;font-weight:500;line-height:1}
.ov .d small{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:2px;font-weight:400}
.ov.wknd .d,.ov a.wknd .d{color:var(--cedar)}
.ov svg{width:22px;height:22px;display:block;margin:7px auto 5px;color:var(--accent)}
.ov .l{font-size:11.5px;line-height:1.3;color:var(--muted);word-break:keep-all}
.ov a.aunt::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:8px 2px 4px}
.legend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:5px;vertical-align:1px}
.legend .wk{color:var(--cedar);font-family:var(--mono);margin-right:4px}

/* ===== day card ===== */
.day{background:var(--surface);border:1px solid var(--line);border-radius:18px;margin:18px 0;scroll-margin-top:118px;overflow:hidden}
.day-head{padding:18px 18px 14px;display:flex;gap:14px;align-items:flex-start}
.date{flex:0 0 auto;width:56px;height:56px;border-radius:14px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center}
.date b{font-family:var(--mono);font-size:24px;font-weight:500;line-height:1;letter-spacing:-.02em}
.date span{font-size:12px;color:var(--muted);margin-top:3px;line-height:1}
.date.wknd{background:var(--cedar-soft)}
.date.wknd b,.date.wknd span{color:var(--cedar)}
.head-main{flex:1;min-width:0;padding-top:2px}
.theme{font-family:var(--serif);font-size:20px;line-height:1.3;margin:0 0 6px;text-wrap:balance}
.meta{font-size:13.5px;color:var(--muted);line-height:1.6}
.meta .sep{margin:0 6px;opacity:.5}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:1px 9px;border-radius:999px;background:var(--accent);color:var(--accent-ink);vertical-align:1px;margin-right:6px;line-height:1.6}
.leaf{color:var(--cedar);font-weight:600}
.wx{flex:0 0 auto;text-align:right;padding-top:2px}
.wx svg{width:28px;height:28px;display:block;margin:0 0 2px auto}
.wx .temps{font-family:var(--mono);font-size:14px;font-weight:500;white-space:nowrap}
.wx .temps span{color:var(--muted)}
.wl{font-family:var(--sans);font-size:11px;color:var(--muted);line-height:1.3;font-weight:400;white-space:nowrap}
.wear{margin:0 18px 6px;padding:9px 12px;border-radius:10px;background:var(--surface-2);font-size:14px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.wear .k{font-size:12px;color:var(--muted);flex:0 0 auto;padding-top:1px;font-weight:600}

/* timeline rail */
.its{list-style:none;margin:0;padding:12px 18px 18px;position:relative}
.its::before{content:"";position:absolute;left:37px;top:24px;bottom:30px;border-left:2px solid var(--line)}
.it{display:grid;grid-template-columns:40px 1fr;gap:0 14px;padding:10px 0;position:relative}
.ic{width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent);position:relative;z-index:1}
.ic svg{width:20px;height:20px}
.it.warn .ic{border-color:var(--cedar);color:var(--cedar);background:var(--cedar-soft)}
.it.empty .ic{border-style:dashed;color:var(--muted);background:transparent}
.it.empty .nm{color:var(--muted);font-weight:600}
.it.empty .bd{border:1.5px dashed var(--line);border-radius:12px;padding:10px 12px}
.bd{min-width:0;padding-top:2px}
.tm{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2;margin-bottom:4px}
.nm{font-weight:700;font-size:17px;line-height:1.35;margin:0}
.nm .map{display:inline-block;margin-left:8px;font-size:12.5px;font-weight:500;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:1px 8px;vertical-align:2px;white-space:nowrap}
.nm .map:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ab{margin:6px 0 0;font-size:15px;line-height:1.6;color:var(--ink)}
.tp{margin:6px 0 0;font-size:13.5px;line-height:1.55;color:var(--muted)}
.tp::before{content:"↳ ";opacity:.7}
.opt{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--surface-2);font-size:13.5px;line-height:1.55}
.opt b{color:var(--cedar)}
/* naver blog links */
.blogs{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.bk{font-size:11.5px;color:#03C75A;font-weight:700;letter-spacing:.02em}
.bl{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);font-size:14px;line-height:1.45;padding:8px 11px;border-radius:9px;background:var(--surface-2);border:1px solid transparent}
.bl:hover{border-color:var(--line)}
.bl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bl span{flex:1;min-width:0}
.bl small{flex:0 0 auto;font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.bl::before{content:"N";flex:0 0 auto;display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:4px;background:#03C75A;color:#fff;font-size:11px;font-weight:800}

/* ===== tours ===== */
.tour{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.tour-top{display:grid;grid-template-columns:44px 1fr auto;gap:0 14px;align-items:start}
.tour-top .ic{width:44px;height:44px}
.tour-top .ic svg{width:24px;height:24px}
.tour .rank{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.tour h3{margin:2px 0 0;font-size:18px;font-family:var(--serif);line-height:1.3}
.price{font-family:var(--mono);font-size:16px;font-weight:500;white-space:nowrap;text-align:right}
.price small{display:block;font-size:11.5px;color:var(--muted);font-weight:500;white-space:normal;max-width:130px;line-height:1.35}
.why{margin:12px 0 0;font-size:15.5px;line-height:1.6}
.facts{margin:12px 0 0;padding:0;list-style:none;font-size:14px;color:var(--muted);line-height:1.6}
.facts li{padding-left:1.1em;text-indent:-1.1em}
.facts li b{color:var(--ink);font-weight:600}
.walk{font-family:var(--mono);letter-spacing:.12em;color:var(--accent)}
.tour-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;border-radius:9px;padding:9px 14px;font-size:14px;font-weight:500;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tour.small{padding:14px 18px}
.tour.small .tour-top{grid-template-columns:1fr auto}
.tour.small h3{font-family:var(--sans);font-size:16.5px;font-weight:600}
.tour.small .why{margin-top:6px;font-size:14.5px}
.tour.hold{opacity:.8}

/* ===== weather ===== */
table{width:100%;border-collapse:collapse;font-size:14.5px}
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
th{font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 12px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
tr:last-child td{border-bottom:0}
td.d{font-family:var(--mono);white-space:nowrap}
td.d.wknd{color:var(--cedar)}
td.tp2{font-family:var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}
td.tp2 span{color:var(--muted)}
td svg{width:22px;height:22px;vertical-align:middle;margin-right:6px}
.list{margin:0;padding:0;list-style:none}
.list li{padding:10px 0;border-bottom:1px dashed var(--line);font-size:15.5px;line-height:1.6}
.list li:last-child{border-bottom:0}
.list li b{font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:440px){.cols{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card h3{margin:0 0 6px;font-size:15.5px}
.card .list li{font-size:14.5px;padding:8px 0}

/* ===== move ===== */
.dist{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.dist li{display:grid;grid-template-columns:1fr auto auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center;font-size:15px}
.dist li:last-child{border-bottom:0}
.dist .km{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.dist .min{font-family:var(--mono);font-size:15px;font-weight:500;white-space:nowrap}
.dist .grp{grid-column:1/-1;font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;color:var(--muted);background:var(--surface-2);padding:7px 16px}
.dist li.hdr{padding:0;display:block}
.dist .map{font-size:13px;color:var(--accent);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:2px 9px;white-space:nowrap}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;padding:11px 0;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.55}
.step:last-child{border-bottom:0}
.step .no{font-family:var(--mono);color:var(--accent);font-weight:500}
.step .n{color:var(--muted);font-size:14px}
footer{margin-top:40px;color:var(--muted);font-size:13.5px;border-top:1px solid var(--line);padding-top:16px;line-height:1.6}
footer p{margin:6px 0}

/* ===== 한눈에 ===== */
.sum{list-style:none;margin:10px 0 0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.sum li{border-bottom:1px solid var(--line)}
.sum li:last-child{border-bottom:0}
.sum .row{appearance:none;border:0;background:none;font:inherit;color:inherit;text-align:left;display:grid;grid-template-columns:40px 1fr auto;gap:12px;width:100%;padding:13px 14px;cursor:pointer}
.sum .row:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.sum .row[aria-pressed="true"]{background:var(--accent-soft)}
.sum .dd{font-family:var(--mono);font-size:21px;font-weight:500;line-height:1;text-align:center;padding-top:2px}
.sum .dd small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted);margin-top:5px}
.sum .dd.wknd,.sum .dd.wknd small{color:var(--cedar)}
.sum .rb{display:block;min-width:0}
.sum .wq{display:block;text-align:right;padding-top:1px}
.sum .wq svg{width:24px;height:24px;display:block;margin:0 0 2px auto}
.sum .wq span{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.sum .wq small{color:var(--muted);font-size:12px}
.sum .th{display:block;font-weight:700;font-size:15.5px;line-height:1.35}
.sum .fl{display:block;font-size:14px;color:var(--muted);line-height:1.5;margin-top:3px}
.sum .fl .ar{opacity:.55;margin:0 1px}
.sum .fl .gp{color:var(--cedar);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.chip{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);line-height:1.7}
.chip.au{background:var(--accent);color:var(--accent-ink)}
.chip.je{background:var(--cedar-soft);color:var(--cedar)}
.chip.gp{border:1px dashed var(--cedar);color:var(--cedar);background:transparent;padding:0 7px}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin:26px 0 0;scroll-margin-top:78px}
.dchips{display:flex;gap:6px;overflow-x:auto;padding:12px 12px 8px;scrollbar-width:none}
.dchips::-webkit-scrollbar{display:none}
.dchip{flex:0 0 auto;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:6px 11px;font:inherit;font-family:var(--mono);font-size:14px;cursor:pointer;line-height:1.3}
.dchip small{font-family:var(--sans);font-size:11px;margin-left:2px;color:var(--muted)}
.dchip.wknd,.dchip.wknd small{color:var(--cedar)}
.dchip[aria-pressed="true"],.dchip[aria-pressed="true"] small{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mhead{padding:2px 16px 10px}
.mhead .md{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.mhead h3{font-family:var(--serif);font-size:19px;line-height:1.3;margin:2px 0 0;text-wrap:balance}
#mapbox svg.mp{display:block;width:100%;height:auto}
.mp .bg{fill:var(--surface-2)}
.mp .gd{fill:var(--line)}
.mp .r{fill:none;stroke-linecap:round;stroke-linejoin:round}
.mp .r-car{stroke:var(--accent);stroke-width:3.2}
.mp .r-walk{stroke:var(--muted);stroke-width:3;stroke-dasharray:.1 6}
.mp .r-tr{stroke:var(--rain);stroke-width:3.2;stroke-dasharray:7 4}
.mp .r-train{stroke:var(--cedar);stroke-width:3.2;stroke-dasharray:10 4}
.mp .r-ferry{stroke:var(--rain);stroke-width:3;stroke-dasharray:.1 6}
.mp .ld{stroke:var(--muted);stroke-width:1;opacity:.7}
.mp .od{fill:var(--muted)}
.mp .vd{fill:var(--surface);stroke:var(--muted);stroke-width:2}
.mp .mk{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.mp .mn{font-family:var(--mono);font-size:12px;font-weight:500;fill:var(--accent-ink);text-anchor:middle;dominant-baseline:central}
.mp .mh{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.mp .mhi{color:var(--surface)}
.mp .lb{font-family:var(--sans);font-size:11px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--surface-2);stroke-width:3px;stroke-linejoin:round}
.mp .ct{font-family:var(--sans);font-size:10.5px;fill:var(--muted);letter-spacing:.04em}
.mp .sc{stroke:var(--muted);stroke-width:1.5}
.mp .st{font-family:var(--mono);font-size:10px;fill:var(--muted)}
.mlegend{display:flex;flex-wrap:wrap;gap:4px 14px;padding:8px 16px 4px;font-size:12px;color:var(--muted)}
.mlegend svg{width:24px;height:8px;vertical-align:middle;margin-right:4px}
.mlegend line{fill:none;stroke-linecap:round}
.segs{list-style:none;margin:0;padding:6px 16px 4px}
.segs .st{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:5px 0}

  <h2>옷차림 원칙</h2>
  <ul class="list">
    <li><b>레이어 3장</b> — 긴팔 티 + 얇은 플리스(또는 가디건) + <b>후드 있는 방수 재킷</b>. 시애틀 사람들은 우산보다 후드를 씁니다.</li>
    <li><b>신발은 방수 운동화</b> 하나로 통일. 젖은 낙엽·보도가 미끄럽습니다. 레이니어 가는 날만 등산화가 있으면 좋아요.</li>
    <li><b>레이니어(해발 1,650m)</b>는 시애틀보다 8~10°C 낮고 바람 — 체감 0°C. 경량 패딩 + 비니 + 장갑. 첫눈이 올 수도 있는 시기.</li>
    <li><b>페리</b>는 바다 위라 체감이 3~4°C 낮아요. 실내 객실이 있지만 갑판에 나갈 때 목도리·비니.</li>
    <li>낮엔 15~19°C까지 올라가서 <b>벗고 입기 쉬운</b> 구성이 핵심. 얇은 옷 여러 장이 두꺼운 옷 한 장보다 낫습니다.</li>
  </ul>

  <h2>가져갈 것</h2>
  <div class="cols">
    <div class="card"><h3>옷</h3><ul class="list">
      <li>방수 후드 재킷 (필수)</li><li>얇은 플리스·가디건 2</li><li>긴팔 티 4~5, 반팔 1~2</li><li>바지 3 (청바지 1, 속건 1)</li><li>방수 운동화 + 편한 실내용</li><li>비니·장갑·얇은 목도리 (레이니어·바다용)</li><li>얇은 경량 패딩 (레이니어용, 저녁용)</li>

    </ul></div>

  <h2>How to dress</h2>
  <ul class="list">
    <li><b>Three layers</b> — long-sleeve tee + light fleece (or cardigan) + <b>waterproof hooded jacket</b>. Seattleites use hoods more than umbrellas.</li>
    <li><b>One pair of waterproof sneakers</b> for everything. Wet leaves and sidewalks get slippery. Hiking shoes are nice for Rainier day only.</li>
    <li><b>Rainier (1,650 m)</b> is 8–10°C colder than Seattle and windy — feels near 0°C. Light puffer + beanie + gloves. First snow is possible this time of year.</li>
    <li>On the <b>ferry</b>, it feels 3–4°C colder over the water. There's an indoor cabin, but bring a scarf and beanie for the deck.</li>
    <li>Days reach 15–19°C, so <b>easy on/off layers</b> are key. Several thin layers beat one thick one.</li>
  </ul>

      if(it.via){ vias+='<circle class="vd" cx="'+f(xy[0])+'" cy="'+f(xy[1])+'" r="4"/>'; return; }
      if(it.k==='home'){ if(seen.home) return; seen.home=1; M.push({x:xy[0],y:xy[1],x0:xy[0],y0:xy[1],home:1,lb:PL.home[0]}); return; }
      num++; M.push({x:xy[0],y:xy[1],x0:xy[0],y0:xy[1],num:num,lb:PL[it.k][0]});
    });
    for(var iter=0; iter<60; iter++){
      var moved=false;
      for(var i=0;i<M.length;i++) for(var j=i+1;j<M.length;j++){
        var dx=M[j].x-M[i].x, dy=M[j].y-M[i].y, d=Math.sqrt(dx*dx+dy*dy);
        if(d<25){ if(d<0.01){ dx=Math.cos(j*2.4); dy=Math.sin(j*2.4); d=1; } var pu=(25-d)/2, ux=dx/d, uy=dy/d;
          M[i].x-=ux*pu; M[i].y-=uy*pu; M[j].x+=ux*pu; M[j].y+=uy*pu; moved=true; }
      }
      M.forEach(function(m){ m.x=Math.max(14,Math.min(MW-14,m.x)); m.y=Math.max(14,Math.min(MH-30,m.y)); });
      if(!moved) break;
    }

    var pxkm=sc/111, nice=[0.5,1,2,5,10,20,50,100], km=nice[0];
    nice.forEach(function(v){ if(v*pxkm<=80) km=v; });
    var bl=f(km*pxkm);
    var boxes=M.map(function(m){ return {x:m.x-12,y:m.y-12,w:24,h:24}; });
    boxes.push({x:6,y:MH-22,w:bl+50,h:20});
    var lead='', marks='', labels='';
    M.forEach(function(m){
      if(Math.abs(m.x-m.x0)+Math.abs(m.y-m.y0)>4){
        lead+='<line class="ld" x1="'+f(m.x0)+'" y1="'+f(m.y0)+'" x2="'+f(m.x)+'" y2="'+f(m.y)+'"/><circle class="od" cx="'+f(m.x0)+'" cy="'+f(m.y0)+'" r="2.2"/>';
      }
      if(m.home){
        marks+='<g transform="translate('+f(m.x)+' '+f(m.y)+')"><rect class="mh" x="-11" y="-11" width="22" height="22" rx="6"/><use class="mhi" href="#p-home" x="-8" y="-8" width="16" height="16"/></g>';
      } else {
        marks+='<circle class="mk" cx="'+f(m.x)+'" cy="'+f(m.y)+'" r="11"/><text class="mn" x="'+f(m.x)+'" y="'+f(m.y)+'">'+m.num+'</text>';
      }
    });
    M.forEach(function(m){
      var wd=tw(m.lb), ht=13;
      var cands=[{x:m.x+15,y:m.y-ht/2},{x:m.x-15-wd,y:m.y-ht/2},{x:m.x-wd/2,y:m.y-15-ht},{x:m.x-wd/2,y:m.y+15},{x:m.x-wd+4,y:m.y+14},{x:m.x-wd+4,y:m.y-14-ht},{x:m.x-4,y:m.y+14},{x:m.x-4,y:m.y-14-ht}];
      for(var c=0;c<cands.length;c++){
        var b={x:cands[c].x,y:cands[c].y,w:wd,h:ht};
        if(b.x<4||b.y<4||b.x+b.w>MW-4||b.y+b.h>MH-4) continue;
        if(boxes.some(function(o){ return hit(b,o); })) continue;
        boxes.push(b);
        labels+='<text class="lb" x="'+f(b.x)+'" y="'+f(b.y+10)+'">'+esc(m.lb)+'</text>';
        break;
      }
    });
    var cities='';
    CITY.forEach(function(c){
      var xy=P(c[1],c[2]), wd=tw(c[0])*0.95, b={x:xy[0]-wd/2,y:xy[1]-7,w:wd,h:13};
      if(b.x<6||b.y<6||b.x+b.w>MW-6||b.y+b.h>MH-24) return;
      if(boxes.some(function(o){ return hit(b,o); })) return;
      if(M.some(function(m){ return Math.abs(m.x0-xy[0])<16 && Math.abs(m.y0-xy[1])<16; })) return;
      boxes.push(b);
      cities+='<text class="ct" x="'+f(b.x)+'" y="'+f(b.y+10)+'">'+esc(c[0])+'</text>';
    });

    var scale='<line class="sc" x1="12" y1="'+(MH-12)+'" x2="'+(12+bl)+'" y2="'+(MH-12)+'"/><line class="sc" x1="12" y1="'+(MH-16)+'" x2="12" y2="'+(MH-8)+'"/><line class="sc" x1="'+(12+bl)+'" y1="'+(MH-16)+'" x2="'+(12+bl)+'" y2="'+(MH-8)+'"/><text class="st" x="'+(16+bl)+'" y="'+(MH-9)+'">'+km+' km</text>';
    var north='<text class="st" x="'+(MW-16)+'" y="16" text-anchor="middle">N</text><path class="sc" d="M'+(MW-16)+' 20v10" fill="none"/>';

    document.getElementById('mapbox').innerHTML='<svg class="mp" viewBox="0 0 '+MW+' '+MH+'" role="img" aria-label="'+esc(DAYS[n-1].theme)+' route map">'
      +'<defs><pattern id="gdot" width="16" height="16" patternUnits="userSpaceOnUse"><circle class="gd" cx="1" cy="1" r="1"/></pattern></defs>'
      +'<rect class="bg" width="'+MW+'" height="'+MH+'"/><rect width="'+MW+'" height="'+MH+'" fill="url(#gdot)"/>'
      +cities+paths+lead+vias+marks+labels+scale+north+'</svg>';
  };

  var segList = function(n){
    var num=0, h='';
    RT[n].forEach(function(it,i){
      if(it.m && i>0) h+='<li class="mv mv-'+MC[it.m]+'"><span class="ln"></span><span class="tx"><b>'+MODE[it.m]+'</b>'+esc(it.d||'')+'</span></li>';
      var tm='<span class="tm2">'+(it.t||'')+'</span>';
      var sub=it.sub?'<span class="sb">'+esc(it.sub)+'</span>':'';
      if(it.gap){ h+='<li class="st gapr"><span class="no gp">?</span><span><span class="nm2">'+esc(it.nm)+'</span>'+sub+'</span>'+tm+'</li>'; return; }
      if(it.note){ h+='<li class="st'+(it.warn?' wn':'')+'"><span class="no nt">'+(it.warn?'!':'·')+'</span><span><span class="nm2">'+esc(it.nm)+'</span>'+sub+'</span>'+tm+'</li>'; return; }
      var badge;
      if(it.k==='home') badge='<span class="no hm">'+svg('p-home')+'</span>';
      else if(it.via) badge='<span class="no vi"></span>';
      else { num++; badge='<span class="no">'+num+'</span>'; }
      h+='<li class="st'+(it.via?' via':'')+'">'+badge+'<span><span class="nm2">'+esc(it.nm)+'</span>'+sub+'</span>'+tm+'</li>';
    });
    document.getElementById('segs').innerHTML=h;
  };

  var gUrl = function(n){
    var q=[];
    RT[n].forEach(function(it){ if(it.k && !it.via){ var a=PL[it.k][3]; if(q[q.length-1]!==a) q.push(a); } });
    if(q.length<2) return M(q[0]||'Bothell, WA');
    var u='https://www.google.com/maps/dir/?api=1&origin='+encodeURIComponent(q[0])+'&destination='+encodeURIComponent(q[q.length-1]);
    if(q.length>2) u+='&waypoints='+encodeURIComponent(q.slice(1,-1).join('|'));
    return u;
  };

  var cur=1;
  var pick = function(n, scroll){
    cur=n; window.__day=n; var d=DAYS[n-1];
    document.querySelectorAll('.sum .row').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.n===n)); });
    var dc=document.getElementById('dchips');
    dc.querySelectorAll('.dchip').forEach(function(b){ b.setAttribute('aria-pressed', String(+b.dataset.n===n)); });
    var on=dc.querySelector('.dchip[data-n="'+n+'"]');
    if(on) dc.scrollLeft = on.offsetLeft - dc.clientWidth/2 + on.offsetWidth/2;
    document.getElementById('mdate').textContent = d.date.replace('.','/').replace('/0','/')+' '+d.w+'';
    document.getElementById('mtitle').textContent = d.theme;
    drawMap(n); segList(n);
    document.getElementById('gmap').href = gUrl(n);
    if(scroll) document.getElementById('mapcard').scrollIntoView({block:'start'});
  };

  document.getElementById('sum').innerHTML = DAYS.map(function(d){
    var items=RT[d.n]||[], wk=(d.w==='Sat'||d.w==='Sun')?' wknd':'';
    var fl=items.filter(function(it){ return it.s && !it.via; }).map(function(it){ return it.gap?'<span class="gp">'+esc(it.s)+'</span>':esc(it.s); }).join(' <span class="ar">→</span> ');
    var ch = d.aunt ? '<span class="chip au">With Aunt</span>' : '<span class="chip">'+esc(d.who)+'</span>';
    if(JENNY[d.n]) ch+='<span class="chip je">Jenny can join</span>';
    if(d.how && d.how!=='—') ch+='<span class="chip">'+esc(d.how)+'</span>';
    if(items.some(function(it){ return it.gap; })) ch+='<span class="chip gp">Has open slot</span>';
    return '<li><button class="row" type="button" data-n="'+d.n+'" aria-pressed="false"><span class="dd'+wk+'">'+d.date.slice(3).replace(/^0/,'')+'<small>'+d.w+'</small></span>'
      +'<span class="rb"><span class="th">'+esc(d.theme)+'</span><span class="fl">'+fl+'</span><span class="chips">'+ch+'</span></span>'
      +'<span class="wq">'+svg(WI[WX[d.n-1].ic])+'<span>'+WX[d.n-1].hi+'° <small>'+WX[d.n-1].lo+'°</small></span></span></button></li>';
  }).join('');
  document.getElementById('dchips').innerHTML = DAYS.map(function(d){
    var wk=(d.w==='Sat'||d.w==='Sun')?' wknd':'';
    return '<button class="dchip'+wk+'" type="button" data-n="'+d.n+'" aria-pressed="false">'+d.date.replace('.','/').replace('/0','/')+'<small>'+d.w+'</small></button>';
  }).join('');
  document.querySelectorAll('.sum .row').forEach(function(b){ b.addEventListener('click', function(){ pick(+b.dataset.n, true); }); });
  document.querySelectorAll('.dchip').forEach(function(b){ b.addEventListener('click', function(){ pick(+b.dataset.n, false); }); });
  document.getElementById('todetail').addEventListener('click', function(){
    show('plan');
    var el=document.getElementById('d'+cur); if(el) el.scrollIntoView({block:'start'});
  });
  var now=new Date(), def=1;
  if(now.getFullYear()===2026 && now.getMonth()===9 && now.getDate()<=10) def=now.getDate();
  if(window.__day) def=window.__day;
  pick(def, false);

}

  var DEFAULT_LANG='ko', app=document.getElementById('app');
  var setLang=function(l, keep){
    var y=window.scrollY, prev=document.documentElement.lang||l;
    app.innerHTML=document.getElementById('tpl-'+l).innerHTML;
    (l==='en'?runEN:runKO)();
    document.documentElement.lang=l;
    document.title = l==='en' ? 'Mom & Me in Seattle' : '시애틀 모녀 여행';
    var sw=app.querySelector('.lang .sw');
    if(sw){
      sw.setAttribute('aria-checked', String(prev==='en'));
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ sw.setAttribute('aria-checked', String(l==='en')); }); });
      sw.addEventListener('click', function(){ setLang(l==='en'?'ko':'en', true); });
    }
    app.querySelectorAll('.lang [data-l]').forEach(function(x){
      x.classList.toggle('on', x.dataset.l===l);
      x.addEventListener('click', function(){ if(x.dataset.l!==l) setLang(x.dataset.l, true); });
    });
    try{ localStorage.setItem('sea-lang', l); }catch(e){}
    if(keep) window.scrollTo(0,y);
  };
  var start=DEFAULT_LANG;
  try{ var sv=localStorage.getItem('sea-lang'); if(sv==='ko'||sv==='en') start=sv; }catch(e){}
  if(location.hash==='#en') start='en'; else if(location.hash==='#ko') start='ko';
  setLang(start,false);
})();
</script>

</body></html>
